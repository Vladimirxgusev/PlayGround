name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "core/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Keep the same debug signing key between builds so new APKs install
      # over the old one instead of requiring an uninstall.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.sekretutka/signing.jks
          key: sekretutka-signing-key-v1

      - name: Create signing key on first build
        run: |
          mkdir -p ~/.sekretutka
          if [ ! -f ~/.sekretutka/signing.jks ]; then
            keytool -genkeypair -keystore ~/.sekretutka/signing.jks -alias sekretutka \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass sekretutka -keypass sekretutka -dname "CN=Sekretutka"
          fi
          echo "SEKRETUTKA_KEYSTORE=$HOME/.sekretutka/signing.jks" >> "$GITHUB_ENV"

      - name: Test command parser
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Google Cloud needs this fingerprint for the Android OAuth client (Google Tasks sign-in).
      - name: Show signing fingerprint
        run: |
          SHA1=$(keytool -list -v -keystore ~/.sekretutka/signing.jks -alias sekretutka \
            -storepass sekretutka | grep -m1 "SHA1:" | sed 's/.*SHA1: *//')
          echo "SHA-1: $SHA1"
          {
            echo "### Для Google Cloud (OAuth-клиент Android)"
            echo "- Имя пакета: \`app.pomoshnik\`"
            echo "- SHA-1: \`$SHA1\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "sekretutka-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sekretutka-apk
          path: sekretutka-*.apk
          if-no-files-found: error

name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "core/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Keep the same debug signing key between builds so new APKs install
      # over the old one instead of requiring an uninstall.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pomoshnik-debug-keystore-v1

      - name: Test command parser
        run: ./gradlew :core:test --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "pomoshnik-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pomoshnik-apk
          path: pomoshnik-*.apk
          if-no-files-found: error
